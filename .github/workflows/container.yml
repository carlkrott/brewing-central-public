name: container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ispindel-dashboard:ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PROJECT_NAME: ispindel-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ISPINDEL_IMAGE_REF: ispindel-dashboard:ci-${{ github.run_id }}-${{ github.run_attempt }}
      ISPINDEL_CONTAINER_NAME: ispindel-ci-${{ github.run_id }}-${{ github.run_attempt }}-app
      ISPINDEL_DATA_VOLUME: ispindel-ci-${{ github.run_id }}-${{ github.run_attempt }}_ispindel-data
      ISPINDEL_GID: "10001"
      ISPINDEL_BACKEND_PUBLISH: "127.0.0.1:18099:8098"
      ISPINDEL_MODE: test
      ISPINDEL_ADMIN_CONFIGURED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Allocate disposable Compose project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/secrets" "$RUNNER_TEMP/backup-health"
          printf '{"schema_version":"health-evidence-v1","kind":"battery","observed_at":"2026-07-29T00:00:00Z","state":"ok","detail":"ci-fixture","percent":90}' \
            > "$RUNNER_TEMP/evidence/battery.json"
          printf '{"schema_version":"health-evidence-v1","kind":"heartbeat","observed_at":"2026-07-29T00:00:00Z","state":"ok","detail":"ci-fixture","poll_failed":false,"alert_attempted":false,"alert_delivered":false}' \
            > "$RUNNER_TEMP/evidence/heartbeat.json"
          printf '{"probe":"ci-fixture"}' \
            > "$RUNNER_TEMP/backup-health/backup_health.json"
          printf '[]' > "$RUNNER_TEMP/secrets/ingest-tokens.json"
          echo "ISPINDEL_EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "ISPINDEL_SECRETS_DIR=$RUNNER_TEMP/secrets" >> "$GITHUB_ENV"
          echo "ISPINDEL_BACKUP_HEALTH_FILE=$RUNNER_TEMP/backup-health/backup_health.json" >> "$GITHUB_ENV"
          echo "TAILNET_FQDN=" >> "$GITHUB_ENV"
      - name: Verify wheels match SHA256SUMS
        working-directory: wheels
        run: sha256sum -c SHA256SUMS
      - name: Compose config sanity check
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" config --quiet
      - name: Build runtime image (no push)
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" build --pull=false --progress=plain
      - name: Inspect built image
        id: inspect
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')
          if [[ ! "$IMAGE_ID" =~ ^sha256: ]]; then
            echo "Could not resolve immutable image ID for $IMAGE_TAG" >&2
            docker images | head -n20 >&2
            exit 1
          fi
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "PHASE05C_RUNTIME_IMAGE=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "PHASE05C_RUNTIME_SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Disposable Docker runtime contract
        if: always()
        run: python -m pytest -q tests/test_docker_runtime.py
      - name: Download Syft (pinned v1.51.1)
        id: syft
        if: always()
        uses: anchore/sbom-action/download-syft@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5
        with:
          syft-version: v1.51.1
      - name: Emit and validate SBOM
        if: always()
        run: |
          set -euo pipefail
          SYFT="${{ steps.syft.outputs.cmd }}"
          "$SYFT" "$PHASE05C_RUNTIME_IMAGE" -o cyclonedx-json=runtime.sbom.json
          python -c "
          import json, pathlib, sys
          data = json.loads(pathlib.Path('runtime.sbom.json').read_text())
          components = data.get('components') or []
          if not components:
              sys.exit('SBOM has zero components')
          print(f'SBOM components={len(components)}')
          "
          SBOM_SHA256=$(sha256sum runtime.sbom.json | awk '{print $1}')
          SYFT_SHA256=$(sha256sum "$SYFT" | awk '{print $1}')
          SYFT_VERSION=$("$SYFT" version | awk -F': ' '/^Version: /{print $2}')
          if [[ -z "$SYFT_VERSION" ]]; then
            echo "Could not extract Syft numeric version" >&2
            "$SYFT" version >&2
            exit 1
          fi
          {
            echo "image_digest=$PHASE05C_RUNTIME_IMAGE"
            echo "sbom_sha256=$SBOM_SHA256"
            echo "component_count=$(python -c "import json; print(len(json.load(open('runtime.sbom.json'))['components']))")"
            echo "syft_version=$SYFT_VERSION"
            echo "syft_sha256=$SYFT_SHA256"
          } > runtime.sbom.meta
          cat runtime.sbom.meta
      - name: Upload SBOM + metadata
        # Validate SBOMs on every push/PR, but retain artifacts only for
        # canonical main and release-tag pushes. This avoids consuming the
        # account artifact quota on branch/PR qualification runs.
        if: >-
          always() && github.event_name == 'push' && github.event.deleted != true &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-runtime
          path: |
            runtime.sbom.json
            runtime.sbom.meta
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup disposable Compose project + image
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          cleanup() {
            set +e
            docker compose --project-name "$COMPOSE_PROJECT_NAME" down --remove-orphans --rmi all -v 2>/dev/null
            docker volume rm -f "${ISPINDEL_DATA_VOLUME}" 2>/dev/null
            docker image rm -f "$IMAGE_TAG" 2>/dev/null
          }
          trap cleanup EXIT
          echo "Cleanup is handled by the EXIT trap set above."
